apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wordpress-pvc
  labels:
    app: wordpress
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress
  labels:
    app: wordpress
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
  selector:
    app: wordpress
    tier: frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  labels:
    app: wordpress
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: wordpress
      tier: frontend
  template:
    metadata:
      labels:
        app: wordpress
        tier: frontend
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: wordpress
                  tier: mysql
              topologyKey: kubernetes.io/hostname
      containers:
      - image: wordpress-unir-a2:latest
        imagePullPolicy: IfNotPresent
        name: wordpress
        env:
        - name: WORDPRESS_DB_HOST
          value: wordpress-mysql
        - name: WORDPRESS_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-pass
              key: password
        - name: WORDPRESS_DB_USER
          value: wordpress
        - name: WORDPRESS_AUTH_KEY
          valueFrom: { secretKeyRef: { name: mysql-pass, key: auth-key } }
        - name: WORDPRESS_SECURE_AUTH_KEY
          valueFrom: { secretKeyRef: { name: mysql-pass, key: secure-auth-key } }
        - name: WORDPRESS_LOGGED_IN_KEY
          valueFrom: { secretKeyRef: { name: mysql-pass, key: logged-in-key } }
        - name: WORDPRESS_NONCE_KEY
          valueFrom: { secretKeyRef: { name: mysql-pass, key: nonce-key } }
        - name: WORDPRESS_AUTH_SALT
          valueFrom: { secretKeyRef: { name: mysql-pass, key: auth-salt } }
        - name: WORDPRESS_SECURE_AUTH_SALT
          valueFrom: { secretKeyRef: { name: mysql-pass, key: secure-auth-salt } }
        - name: WORDPRESS_LOGGED_IN_SALT
          valueFrom: { secretKeyRef: { name: mysql-pass, key: logged-in-salt } }
        - name: WORDPRESS_NONCE_SALT
          valueFrom: { secretKeyRef: { name: mysql-pass, key: nonce-salt } }
        - name: WORDPRESS_CONFIG_EXTRA
          value: |
            if (isset($_SERVER['HTTP_X_FORWARDED_PROTO']) && strpos($_SERVER['HTTP_X_FORWARDED_PROTO'], 'https') !== false) {
                $_SERVER['HTTPS'] = 'on';
            }
            define('WP_HOME', 'https://wordpressunir.tsolbe.com');
            define('WP_SITEURL', 'https://wordpressunir.tsolbe.com');
        ports:
        - containerPort: 80
          name: wordpress
        volumeMounts:
        - name: wordpress-persistent-storage
          mountPath: /var/www/html
      volumes:
      - name: wordpress-persistent-storage
        persistentVolumeClaim:
          claimName: wordpress-pvc
